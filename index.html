<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一场轻松有趣的网页知识问答游戏。" />
    <title>脑力小测 | Quiz Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="脑力小测首页"><span class="brand-icon">✦</span>脑力小测</a>
        <span class="top-note">给好奇心一点时间</span>
      </header>

      <section class="game-card" id="top" aria-live="polite">
        <div id="startScreen" class="start-screen">
          <div class="hero-art" aria-hidden="true"><span class="hero-spark">✦</span><span class="hero-circle">?</span><span class="hero-dot">✦</span></div>
          <p class="eyebrow">A LITTLE BRAIN BREAK</p>
          <h1>准备好测试<br /><span>你的知识力</span>了吗？</h1>
          <p class="lead">5 道轻松小题，看看今天的你能答对几题。</p>
          <div class="game-facts"><span>◷ 约 2 分钟</span><span>✦ 5 道题</span><span>♡ 轻松无压力</span></div>
          <button class="primary-button" id="startButton" type="button">开始挑战 <span>→</span></button>
          <p class="fine-print">答题过程中可随时查看答案解析</p>
        </div>

        <div id="quizScreen" class="quiz-screen" hidden>
          <div class="quiz-topline"><span id="questionLabel">QUESTION 01 / 05</span><span class="score-pill">得分 <strong id="scoreValue">0</strong></span></div>
          <div class="progress-track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="progressBar"></span></div>
          <p class="question-category" id="questionCategory">常识小问</p>
          <h2 id="questionText"></h2>
          <div class="answer-list" id="answerList"></div>
          <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
          <div class="quiz-footer"><span id="answeredLabel">选一个你认为正确的答案</span><button class="next-button" id="nextButton" type="button" disabled>下一题 <span>→</span></button></div>
        </div>

        <div id="resultScreen" class="result-screen" hidden>
          <div class="result-icon" id="resultIcon" aria-hidden="true">🎉</div>
          <p class="eyebrow">QUIZ COMPLETE</p>
          <h2 id="resultTitle">挑战完成！</h2>
          <p class="result-copy" id="resultCopy"></p>
          <div class="score-summary"><strong id="finalScore">0/5</strong><span>答对题数</span></div>
          <p class="result-message" id="resultMessage"></p>
          <button class="primary-button" id="restartButton" type="button">再玩一次 <span>↻</span></button>
        </div>
      </section>
      <footer>慢慢来，每一次好奇都算数 <span>✦</span></footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
